plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.flanksource'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind:2.18.9'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.9'
    implementation 'com.networknt:json-schema-validator:1.5.9'
    implementation 'org.openapitools:jackson-databind-nullable:0.2.6'
    compileOnly 'javax.annotation:javax.annotation-api:1.3.2'
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

layout.buildDirectory = file(providers.gradleProperty('bindingOutput').get())
def repositoryRoot = file('../..')
def generatorJar = file(providers.gradleProperty('generatorJar').get())
def generatedModels = layout.buildDirectory.dir('generated')
def canonicalSchema = new File(repositoryRoot, 'schema/uir.schema.json')
def openAPI = new File(repositoryRoot, 'schema/uir.openapi.json')
def generatorConfig = new File(repositoryRoot, 'schema/java-generator.json')

tasks.register('generateModels', JavaExec) {
    inputs.files(openAPI, generatorConfig, generatorJar)
    outputs.dir(generatedModels)
    classpath = files(generatorJar)
    mainClass = 'org.openapitools.codegen.OpenAPIGenerator'
    args 'generate', '--input-spec', openAPI,
        '--generator-name', 'java', '--config', generatorConfig,
        '--output', generatedModels.get().asFile,
        '--model-package', 'com.flanksource.uir',
        '--global-property', 'models,modelDocs=false,modelTests=false',
        '--additional-properties', 'library=resttemplate,serializationLibrary=jackson,useOneOfInterfaces=true,legacyDiscriminatorBehavior=false,hideGenerationTimestamp=true,containerDefaultToNull=true'
    doFirst {
        delete generatedModels
    }
}

sourceSets.main.java.srcDir(generatedModels.map { it.dir('src/main/java') })
tasks.named('compileJava') {
    dependsOn 'generateModels'
}
tasks.named('sourcesJar') {
    dependsOn 'generateModels'
}
tasks.named('processResources') {
    from(canonicalSchema)
}

tasks.register('syncRuntime', Copy) {
    from configurations.runtimeClasspath
    into layout.buildDirectory.dir('runtime')
}

tasks.named('jar') {
    archiveBaseName = 'uir'
}

dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
}

publishing {
    publications {
        uir(MavenPublication) {
            from components.java
            artifactId = 'uir'
        }
    }
}
