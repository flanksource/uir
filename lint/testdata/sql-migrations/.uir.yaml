version: 1
sources:
  - match_regex: '^scripts/(?P<phase>Pre|Post)Deployment_(?P<name>[^/]+?(?:_(?P<countries>(?:BW|MW|ZW|UG|SZ|KE)(?:_(?:BW|MW|ZW|UG|SZ|KE))*))?)/SQLData\.xml$'
    dialect: tsql
    transform: >-
      {
        "content": file.content,
        "filename": file.path.trimSuffix(".xml") + ".sql",
        "package": "migrations",
        "metadata": {
          "name": captures.name,
          "phase": captures.phase.lower(),
          "labels": captures.phase == "Post" && captures.countries != ""
            ? {"country": captures.countries.split("_")}
            : {}
        }
      }
lint:
  compatibility_level: 130
  rules:
    - id: no-ledger-writes
      query: 'finance.ledger ~w'
      message: 'Migration writes to {{.symbol}}'
    - id: no-mask-pan-calls
      query: >-
        SELECT symbol.name AS name FROM references(sql.function:mask_pan)
        WHERE role = 'call' AND symbol.package = 'dbo'
      message: 'Migration calls dbo.{{.name}}'
