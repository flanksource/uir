name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # cross_language_test.go shells out to python3 python/test_uir.py.
          python-version: "3.12"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install browser dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Install API test dependencies
        run: pnpm --dir packages/api install --frozen-lockfile

      - name: Build
        run: make build

      - name: Compile model for js/wasm
        run: make wasm-check

      - name: Test Go
        run: go test ./... -race

      - name: Test browser
        run: pnpm --dir web run test

      - name: Test API client
        run: pnpm --dir packages/api run test

      - name: Check embedded browser assets
        run: test -z "$(git status --porcelain -- web/dist)"

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Python UIR model
        run: python3 python/test_uir.py

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: uir:ci
          build-args: VERSION=ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Smoke test image
        run: test "$(docker run --rm uir:ci --version)" = "uir version ci"

  release:
    needs: [go, python, image]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      id-token: write
    uses: ./.github/workflows/release.yml
