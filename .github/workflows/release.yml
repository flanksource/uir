name: Release

on:
  workflow_call:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semantic.outputs.new_release_published }}
      version: ${{ steps.semantic.outputs.new_release_version }}
      tag: ${{ steps.semantic.outputs.new_release_git_tag }}
      git_commit: ${{ steps.revision.outputs.commit }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: true

      # semantic-release only sees tags reachable from the branch. When history is
      # rewritten after a release, the existing tag drops out of main and the next run
      # tries to re-create it ("tag already exists"). Merging the highest tag with the
      # ours strategy changes no files; it only makes the tag an ancestor, so the next
      # version follows it.
      - name: Reconnect latest release tag
        run: |
          latest=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$latest" ] && ! git merge-base --is-ancestor "$latest" HEAD; then
            echo "::warning::$latest is not reachable from $GITHUB_REF_NAME; merging it with the ours strategy before versioning"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              merge -s ours --no-edit -m "chore(release): reconnect $latest" "$latest"
          fi

      - name: Create release with semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@16ca923e6ccbb50770c415a0ccd43709a8c5f7a4 # v4.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Read release revision
        id: revision
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  binaries:
    needs: version
    if: needs.version.outputs.published == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
      version: ${{ needs.version.outputs.version }}

  docker:
    needs: [version, binaries]
    if: needs.version.outputs.published == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: flanksource/action-workflows/.github/workflows/publish-multi-platform-docker-image.yml@v1.3.0
    with:
      login_to_dockerhub: false
      platforms: linux/amd64,linux/arm64
      image_tags: |
        ghcr.io/${{ github.repository }}:${{ needs.version.outputs.tag }}
        ghcr.io/${{ github.repository }}:${{ needs.version.outputs.version }}
        ghcr.io/${{ github.repository }}:latest
      build_args: |
        VERSION=${{ needs.version.outputs.version }}
        GIT_COMMIT=${{ needs.version.outputs.git_commit }}

  assets:
    needs: [version, binaries, docker]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist

      - name: Generate checksums
        working-directory: dist
        run: sha256sum uir_*.tar.gz > checksums.txt

      - name: Attach release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          draft: true
          fail_on_unmatched_files: true
          files: |
            dist/uir_*.tar.gz
            dist/checksums.txt

  publish:
    needs: [version, assets]
    if: needs.version.outputs.published == 'true'
    permissions:
      contents: write
    uses: flanksource/action-workflows/.github/workflows/publish-release.yml@v1.3.0
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets:
      token: ${{ secrets.GITHUB_TOKEN }}
